<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本周爬哪座山？ - ARCADE EDITION</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --neon-green: #39ff14;
      --neon-cyan: #0ff;
      --neon-pink: #ff00ff;
      --neon-yellow: #ffea00;
      --neon-red: #ff073a;
      --bg-color: #050510;
      --grid-color: rgba(0, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'ZCOOL KuaiLe', cursive, system-ui, sans-serif;
      /* Outrun retro grid background */
      background-image: 
        linear-gradient(transparent 95%, var(--grid-color) 95%),
        linear-gradient(90deg, transparent 95%, var(--grid-color) 95%);
      background-size: 40px 40px;
      background-position: center bottom;
      perspective: 1000px;
    }

    /* Moving ground grid effect */
    body::before {
      content: "";
      position: fixed;
      bottom: 0;
      left: -50%;
      width: 200%;
      height: 40vh;
      background-image: 
        linear-gradient(transparent 90%, var(--neon-pink) 95%),
        linear-gradient(90deg, transparent 95%, var(--neon-pink) 95%);
      background-size: 50px 50px;
      transform: rotateX(75deg);
      transform-origin: center bottom;
      z-index: -2;
      animation: gridMove 2s linear infinite;
      opacity: 0.6;
    }

    @keyframes gridMove {
      from { transform: rotateX(75deg) translateY(0); }
      to { transform: rotateX(75deg) translateY(50px); }
    }

    /* CRT Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.2) 50%,
        rgba(0, 0, 0, 0.2)
      );
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
    }

    /* CRT Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 50%, rgba(0, 0, 0, 0.8) 100%);
      z-index: 998;
      pointer-events: none;
    }

    .shell {
      position: relative;
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 60px;
      z-index: 10;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 15px;
      color: var(--neon-cyan);
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      border: 2px solid var(--neon-cyan);
      border-radius: 4px;
      box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
      background: rgba(0, 255, 255, 0.1);
      animation: blink 2s infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1.1;
      color: #fff;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-pink),
        0 0 40px var(--neon-pink),
        0 0 80px var(--neon-pink);
      position: relative;
    }

    /* Glitch effect for title */
    .glitch {
      position: relative;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
    }
    .glitch::before {
      left: 2px;
      text-shadow: -2px 0 var(--neon-cyan);
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim 5s infinite linear alternate-reverse;
    }
    .glitch::after {
      left: -2px;
      text-shadow: -2px 0 var(--neon-red);
      clip: rect(44px, 450px, 56px, 0);
      animation: glitch-anim2 5s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(10px, 9999px, 80px, 0); }
      5% { clip: rect(32px, 9999px, 12px, 0); }
      10% { clip: rect(89px, 9999px, 54px, 0); }
      15% { clip: rect(12px, 9999px, 90px, 0); }
      20% { clip: rect(54px, 9999px, 23px, 0); }
      25% { clip: rect(1px, 9999px, 40px, 0); }
      30% { clip: rect(0, 0, 0, 0); }
      100% { clip: rect(0, 0, 0, 0); }
    }
    @keyframes glitch-anim2 {
      0% { clip: rect(65px, 9999px, 100px, 0); }
      5% { clip: rect(12px, 9999px, 50px, 0); }
      10% { clip: rect(40px, 9999px, 12px, 0); }
      15% { clip: rect(80px, 9999px, 34px, 0); }
      20% { clip: rect(23px, 9999px, 98px, 0); }
      25% { clip: rect(60px, 9999px, 12px, 0); }
      30% { clip: rect(0, 0, 0, 0); }
      100% { clip: rect(0, 0, 0, 0); }
    }

    .machine {
      position: relative;
      margin-top: 40px;
      padding: 30px;
      background: #111;
      border: 4px solid #333;
      border-radius: 20px;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(0,0,0,1),
        0 0 15px var(--neon-cyan),
        0 0 30px var(--neon-pink);
    }

    /* Screen shake animation class */
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both infinite;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .reel-wrap {
      position: relative;
      height: 300px;
      background: #000;
      border: 6px solid #222;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reel-wrap::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 30%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      z-index: 2;
    }
    .reel-wrap::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 30%;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 2;
    }

    /* The target sight */
    .target-line {
      position: absolute;
      top: 50%;
      left: 10px;
      right: 10px;
      height: 80px;
      transform: translateY(-50%);
      border: 2px solid var(--neon-yellow);
      border-radius: 8px;
      background: rgba(255, 234, 0, 0.1);
      box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 15px var(--neon-yellow);
      z-index: 1;
      pointer-events: none;
    }

    .reel {
      width: 100%;
      transform-style: preserve-3d;
      perspective: 800px;
    }

    .reel-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 8px;
      transition: all 0.1s;
    }

    .rolling .reel-item {
      filter: blur(2px);
      transform: scaleY(1.2);
    }

    .reel-item strong {
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 0 0 5px var(--neon-cyan);
    }

    .reel-item span {
      font-size: 1.2rem;
      color: #aaa;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .easy { color: #000; background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
    .normal { color: #000; background: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }
    .hard { color: #000; background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

    .controls {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }

    /* Arcade 3D Button */
    .arcade-btn {
      position: relative;
      display: inline-block;
      cursor: pointer;
      outline: none;
      border: 0;
      vertical-align: middle;
      text-decoration: none;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 2rem;
      color: #fff;
      text-transform: uppercase;
      padding: 1.25em 2em;
      background: #e74c3c;
      border: 2px solid #c0392b;
      border-radius: 15px;
      transform-style: preserve-3d;
      transition: transform 150ms cubic-bezier(0, 0, 0.58, 1), background 150ms cubic-bezier(0, 0, 0.58, 1);
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.3),
        0 10px 0 #c0392b,
        0 10px 20px rgba(0,0,0,0.5),
        0 0 20px var(--neon-red);
      text-shadow: 0 2px 2px rgba(0,0,0,0.3);
    }
    
    .arcade-btn.cyan {
      background: #00d2d3;
      border-color: #01a3a4;
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.3),
        0 10px 0 #01a3a4,
        0 10px 20px rgba(0,0,0,0.5),
        0 0 20px var(--neon-cyan);
    }

    .arcade-btn:active, .arcade-btn.pressed {
      transform: translateY(10px);
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.3),
        0 0 0 #c0392b,
        0 0 10px rgba(0,0,0,0.5),
        0 0 20px var(--neon-red);
    }

    .arcade-btn.cyan:active, .arcade-btn.cyan.pressed {
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.3),
        0 0 0 #01a3a4,
        0 0 10px rgba(0,0,0,0.5),
        0 0 20px var(--neon-cyan);
    }

    .arcade-btn:disabled {
      filter: grayscale(1);
      cursor: not-allowed;
      transform: translateY(10px);
      box-shadow: 0 0 0 #555;
    }

    .status {
      margin-top: 30px;
      font-size: 1.8rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
      min-height: 40px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .result {
      display: none;
      margin-top: 40px;
      padding: 30px;
      border: 4px solid var(--neon-pink);
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 30px var(--neon-pink), inset 0 0 20px var(--neon-pink);
      transform: scale(0.8);
      opacity: 0;
    }

    .result.show {
      display: block;
      animation: popIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes popIn {
      to { transform: scale(1); opacity: 1; }
    }

    .result-kicker {
      font-size: 1.5rem;
      color: var(--neon-cyan);
      margin-bottom: 15px;
    }

    .result h2 {
      font-size: 3.5rem;
      margin: 10px 0 20px;
      color: var(--neon-green);
      text-shadow: 0 0 15px var(--neon-green);
    }

    .meta-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    .meta {
      padding: 15px 25px;
      border: 2px solid var(--neon-cyan);
      border-radius: 10px;
      background: rgba(0, 255, 255, 0.1);
      box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .meta b {
      display: block;
      font-size: 2rem;
      color: #fff;
    }

    .meta span {
      font-size: 1.2rem;
      color: var(--neon-cyan);
    }

    canvas.confetti {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .reel-item {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      .controls {
        flex-direction: column;
      }
      .arcade-btn {
        width: 100%;
        font-size: 1.5rem;
      }
      .meta-grid {
        flex-direction: column;
      }
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <canvas class="confetti" id="confetti"></canvas>

  <main class="shell">
    <div class="eyebrow">INSERT COIN TO PLAY</div>
    <h1 class="glitch" data-text="本周爬哪座山？" id="title">本周爬哪座山？</h1>

    <section class="machine" id="machine">
      <div class="reel-wrap" id="reelWrap">
        <div class="target-line"></div>
        <div class="reel" id="reel"></div>
      </div>

      <div class="status" id="status">PRESS START</div>

      <div class="controls">
        <button class="arcade-btn" id="drawBtn" type="button">开始抽山 (START)</button>
        <button class="arcade-btn cyan" id="shuffleBtn" type="button">洗牌 (SHUFFLE)</button>
      </div>

      <article class="result" id="result">
        <div class="result-kicker">>>> WINNER <<<</div>
        <h2 id="resultName"></h2>
        <span class="badge" id="resultDifficulty"></span>
        <div class="meta-grid">
          <div class="meta">
            <b id="resultDistance"></b>
            <span>距离</span>
          </div>
          <div class="meta">
            <b id="resultClimb"></b>
            <span>爬升</span>
          </div>
          <div class="meta">
            <b id="resultTime"></b>
            <span>耗时</span>
          </div>
          <div class="meta">
            <b id="resultSeason"></b>
            <span>季节</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const trails = [
      { name: "暹岗大山-黄陂徒步线", distance: "10.28km", climb: "619m", time: "03:57", season: "1-12月", difficulty: "标准" },
      { name: "大夫山往返线（北门）", distance: "3.75km", climb: "234m", time: "01:30", season: "1-12月", difficulty: "轻松" },
      { name: "油麻山（金坑-华峰）", distance: "8.27km", climb: "628m", time: "02:37", season: "1-12月", difficulty: "标准" },
      { name: "帽峰山-甜橙农庄环线", distance: "5.36km", climb: "344m", time: "01:24", season: "3-7月", difficulty: "轻松" },
      { name: "番禺滴水岩森林公园亲子线", distance: "6.50km", climb: "366m", time: "02:58", season: "1-12月", difficulty: "标准" },
      { name: "火炉山皮卡丘-天鹿湖画心", distance: "25.52km", climb: "1464m", time: "06:11", season: "1-12月", difficulty: "困难" },
      { name: "白云山-六片山徒步线", distance: "11.05km", climb: "378m", time: "02:30", season: "7-12月", difficulty: "轻松" },
      { name: "东平六片山徒步线", distance: "6.53km", climb: "290m", time: "01:47", season: "1-12月", difficulty: "标准" },
      { name: "金麦线（金坑-麦村）", distance: "11.35km", climb: "765m", time: "02:29", season: "5月", difficulty: "标准" },
      { name: "白云山徒步线(水流东-六片山)", distance: "9.54km", climb: "473m", time: "02:35", season: "1-12月", difficulty: "标准" },
      { name: "六片山登山线", distance: "9.76km", climb: "462m", time: "03:14", season: "4月", difficulty: "标准" },
      { name: "黄麻线(长岭登山健身步道)", distance: "10.77km", climb: "689m", time: "01:58", season: "1-12月", difficulty: "轻松" },
      { name: "牛牯嶂徒步线(大水管-牛牯嶂)", distance: "11.45km", climb: "1065m", time: "03:42", season: "1-3,7-12月", difficulty: "困难" },
      { name: "黄埔牛木外线(黄陂-木强水库)", distance: "18.94km", climb: "1054m", time: "06:01", season: "1-12月", difficulty: "困难" },
      { name: "长岭线(长平-永顺大道)", distance: "12.05km", climb: "525m", time: "03:11", season: "1-12月", difficulty: "轻松" },
      { name: "火炉山小环线（凤凰台）", distance: "7.36km", climb: "413m", time: "02:34", season: "1-5,10-12月", difficulty: "轻松" },
      { name: "火龙渔亲子线", distance: "14.12km", climb: "771m", time: "04:49", season: "1-12月", difficulty: "标准" },
      { name: "鸡啼山环线", distance: "10.53km", climb: "486m", time: "01:56", season: "2-4月", difficulty: "标准" },
      { name: "火炉山-凤凰山徒步线", distance: "10.93km", climb: "633m", time: "03:46", season: "1-12月", difficulty: "标准" },
      { name: "黄麻村湖溪小环线", distance: "3.62km", climb: "111m", time: "01:27", season: "1-12月", difficulty: "轻松" },
      { name: "白云山亲子线（永泰-西门）", distance: "7.82km", climb: "301m", time: "01:26", season: "1-12月", difficulty: "轻松" },
      { name: "龙渔线（龙眼洞-龙洞水库）", distance: "13.51km", climb: "719m", time: "06:03", season: "1-12月", difficulty: "标准" },
      { name: "云道（中山纪念堂-云台花园）", distance: "9.05km", climb: "219m", time: "02:07", season: "1-12月", difficulty: "轻松" },
      { name: "龙渔线-简易版", distance: "8.88km", climb: "383m", time: "02:25", season: "1-12月", difficulty: "轻松" },
      { name: "油麻山环线（石牙顶天坑）", distance: "18.66km", climb: "1028m", time: "05:27", season: "3-5,10-11月", difficulty: "困难" },
      { name: "天堂顶（大坪-影古驿站）", distance: "16.30km", climb: "1129m", time: "04:32", season: "9-10月", difficulty: "困难" },
      { name: "牛牯嶂小环线（大猪兜水库）", distance: "6.14km", climb: "540m", time: "02:00", season: "1-12月", difficulty: "标准" },
      { name: "黄麻线短线", distance: "6.17km", climb: "287m", time: "02:10", season: "1-12月", difficulty: "轻松" },
      { name: "牛木线穿黄麻山", distance: "10.26km", climb: "537m", time: "02:49", season: "1-12月", difficulty: "标准" },
      { name: "六片山徒步永泰环线", distance: "16.82km", climb: "830m", time: "04:05", season: "1-4月", difficulty: "困难" },
      { name: "六片山环线", distance: "5.01km", climb: "237m", time: "02:16", season: "1-12月", difficulty: "轻松" },
      { name: "牛木线（牛头山-木强水库）", distance: "16.12km", climb: "844m", time: "05:20", season: "1-12月", difficulty: "困难" }
    ];

    const reel = document.querySelector("#reel");
    const reelWrap = document.querySelector("#reelWrap");
    const machine = document.querySelector("#machine");
    const drawBtn = document.querySelector("#drawBtn");
    const shuffleBtn = document.querySelector("#shuffleBtn");
    const statusText = document.querySelector("#status");
    const result = document.querySelector("#result");
    const resultName = document.querySelector("#resultName");
    const resultDifficulty = document.querySelector("#resultDifficulty");
    const resultDistance = document.querySelector("#resultDistance");
    const resultClimb = document.querySelector("#resultClimb");
    const resultTime = document.querySelector("#resultTime");
    const resultSeason = document.querySelector("#resultSeason");
    const canvas = document.querySelector("#confetti");
    const ctx = canvas.getContext("2d");

    let currentTrails = [...trails];
    let isRolling = false;
    let particles = [];
    let animationFrame = null;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, vol = 0.1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playBlip() {
      playTone(400 + Math.random() * 400, 'square', 0.05, 0.05);
    }

    function playWin() {
      const notes = [440, 554, 659, 880, 1108]; // A major arpeggio
      notes.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 'square', 0.2, 0.1);
        }, i * 100);
      });
    }

    function difficultyClass(difficulty) {
      return { "轻松": "easy", "标准": "normal", "困难": "hard" }[difficulty] || "normal";
    }

    function shuffle(list) {
      return list
        .map((item) => ({ item, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ item }) => item);
    }

    function renderReel(centerIndex = 0) {
      const visible = [];
      for (let offset = -3; offset <= 3; offset++) {
        const index = (centerIndex + offset + currentTrails.length) % currentTrails.length;
        visible.push({ trail: currentTrails[index], offset });
      }

      reel.innerHTML = visible.map(({ trail, offset }) => {
        const depth = Math.abs(offset);
        const scale = 1 - depth * 0.15;
        const opacity = 1 - depth * 0.3;
        const translateY = offset * 85;
        return `
          <div class="reel-item" style="transform: translateY(${translateY}px) scale(${scale}); opacity: ${opacity}; position: absolute; width: 100%; top: calc(50% - 35px);">
            <div>
              <strong>${trail.name}</strong>
              <br>
              <span>${trail.distance} | 爬升 ${trail.climb}</span>
            </div>
            <span class="badge ${difficultyClass(trail.difficulty)}">${trail.difficulty}</span>
          </div>
        `;
      }).join("");
    }

    function showResult(trail) {
      resultName.textContent = trail.name;
      resultDifficulty.textContent = trail.difficulty;
      resultDifficulty.className = `badge ${difficultyClass(trail.difficulty)}`;
      resultDistance.textContent = trail.distance;
      resultClimb.textContent = trail.climb;
      resultTime.textContent = trail.time;
      resultSeason.textContent = trail.season;
      result.classList.remove("show");
      void result.offsetWidth; // trigger reflow
      result.classList.add("show");
    }

    function roll() {
      initAudio();
      if (isRolling) return;

      isRolling = true;
      drawBtn.disabled = true;
      shuffleBtn.disabled = true;
      drawBtn.classList.add("pressed");
      setTimeout(() => drawBtn.classList.remove("pressed"), 200);

      result.classList.remove("show");
      reelWrap.classList.add("rolling");
      machine.classList.add("shake");
      statusText.textContent = "ROLLING...";

      const targetIndex = Math.floor(Math.random() * currentTrails.length);
      const start = performance.now();
      const duration = 4000;
      const startIndex = Math.floor(Math.random() * currentTrails.length);
      const fullRounds = 8;
      const totalSteps = fullRounds * currentTrails.length + ((targetIndex - startIndex + currentTrails.length) % currentTrails.length);

      let lastIndex = -1;

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        // easeOutQuart
        const eased = 1 - Math.pow(1 - progress, 4);
        const step = Math.floor(eased * totalSteps);
        const index = (startIndex + step) % currentTrails.length;

        if (index !== lastIndex) {
          playBlip();
          lastIndex = index;
          renderReel(index);
        }

        if (progress < 1) {
          requestAnimationFrame(tick);
          return;
        }

        renderReel(targetIndex);
        const winner = currentTrails[targetIndex];
        isRolling = false;
        drawBtn.disabled = false;
        shuffleBtn.disabled = false;
        drawBtn.textContent = "再抽一次 (RETRY)";
        reelWrap.classList.remove("rolling");
        machine.classList.remove("shake");
        statusText.textContent = ">>> JACKPOT <<<";
        
        playWin();
        showResult(winner);
        burstConfetti();
      }

      requestAnimationFrame(tick);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function burstConfetti() {
      const colors = ["#39ff14", "#0ff", "#ff00ff", "#ffea00", "#ff073a", "#ffffff"];
      particles = Array.from({ length: 200 }, () => ({
        x: window.innerWidth / 2,
        y: window.innerHeight * 0.5,
        vx: (Math.random() - 0.5) * 30,
        vy: Math.random() * -20 - 5,
        size: Math.random() * 10 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: Math.random() * 60 + 80,
        rotate: Math.random() * Math.PI,
        dr: (Math.random() - 0.5) * 0.5
      }));

      if (!animationFrame) animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter((p) => p.life > 0);

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5; // gravity
        p.vx *= 0.98; // friction
        p.life -= 1;
        p.rotate += p.dr;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotate);
        ctx.globalAlpha = Math.max(p.life / 100, 0);
        ctx.fillStyle = p.color;
        // Draw pixelated confetti (squares)
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      if (particles.length) {
        animationFrame = requestAnimationFrame(animateConfetti);
      } else {
        animationFrame = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    drawBtn.addEventListener("click", roll);
    shuffleBtn.addEventListener("click", () => {
      initAudio();
      if (isRolling) return;
      shuffleBtn.classList.add("pressed");
      setTimeout(() => shuffleBtn.classList.remove("pressed"), 200);
      playTone(300, 'sawtooth', 0.1, 0.1);
      currentTrails = shuffle(currentTrails);
      renderReel(0);
      statusText.textContent = "SHUFFLED!";
    });

    window.addEventListener("resize", resizeCanvas);

    // Initial setup
    resizeCanvas();
    renderReel(0);
  </script>
</body>
</html>
