<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天命抽签 · 广州爬山选择器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #07091a;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.10);
      --gold:    #f5c842;
      --gold2:   #e8973a;
      --amber:   rgba(245,200,66,0.18);
      --teal:    #4ee8c8;
      --violet:  #9d7dff;
      --text:    #f0ece0;
      --muted:   rgba(240,236,224,0.55);
      --easy:    #4ee8a8;
      --normal:  #f5c842;
      --hard:    #ff6b6b;
    }

    html { color-scheme: dark; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Aurora background ── */
    .aurora {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 20% -10%, rgba(78,232,200,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 5%,  rgba(157,125,255,0.18) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 50% 110%, rgba(245,200,66,0.12) 0%, transparent 55%),
        linear-gradient(180deg, #0c1030 0%, #07091a 50%, #0a0c1e 100%);
    }

    /* Stars */
    .stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(200,220,255,0.6) 0 1px, transparent 1.2px);
      background-size: 180px 180px, 130px 130px;
      background-position: 0 0, 65px 90px;
      opacity: 0.35;
      animation: starDrift 40s linear infinite;
    }
    @keyframes starDrift { to { background-position: 360px 360px, 425px 450px; } }

    /* Mountain silhouette SVG */
    .mountains {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 0;
      pointer-events: none; overflow: hidden; height: 38vh;
    }
    .mountains svg { width: 100%; height: 100%; }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      width: min(1000px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 80px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
      text-align: center;
    }

    /* ── Header ── */
    .tag {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 18px;
      border: 1px solid rgba(245,200,66,0.5);
      border-radius: 999px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      background: rgba(245,200,66,0.08);
      backdrop-filter: blur(8px);
      margin-bottom: 22px;
    }
    .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: dot-blink 1.8s ease-in-out infinite; }
    @keyframes dot-blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }

    h1 {
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 55%, var(--gold2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 32px rgba(245,200,66,0.4));
      margin-bottom: 16px;
    }

    .sub {
      max-width: 560px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 44px;
    }

    /* ── Machine card ── */
    .card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: clamp(20px,4vw,36px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 40px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(157,125,255,0.08);
      position: relative; overflow: hidden;
    }
    /* Top shimmer stripe */
    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }

    /* ── Reel window ── */
    .reel-win {
      position: relative;
      height: clamp(300px,40vw,440px);
      border-radius: 20px;
      border: 1px solid rgba(245,200,66,0.25);
      background:
        radial-gradient(ellipse at center, rgba(245,200,66,0.06) 0%, transparent 65%),
        rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6), 0 0 30px rgba(245,200,66,0.06);
    }

    /* Fade masks */
    .reel-win::before, .reel-win::after {
      content: ""; position: absolute; left: 0; right: 0; z-index: 3; pointer-events: none;
    }
    .reel-win::before { top: 0; height: 36%; background: linear-gradient(to bottom, rgba(7,9,26,1), rgba(7,9,26,0)); }
    .reel-win::after  { bottom: 0; height: 36%; background: linear-gradient(to top,   rgba(7,9,26,1), rgba(7,9,26,0)); }

    /* Selection frame */
    .sel-frame {
      position: absolute; top: 50%; left: 16px; right: 16px;
      height: clamp(76px,11vw,100px);
      transform: translateY(-50%);
      border-radius: 14px;
      border: 1.5px solid rgba(245,200,66,0.7);
      background: linear-gradient(90deg, rgba(245,200,66,0.06), rgba(245,200,66,0.12), rgba(245,200,66,0.06));
      box-shadow: 0 0 20px rgba(245,200,66,0.22), inset 0 0 16px rgba(245,200,66,0.08);
      z-index: 2; pointer-events: none;
    }
    /* Corner marks */
    .sel-frame::before, .sel-frame::after {
      content: "";
      position: absolute; top: 50%; width: 20px; height: 20px;
      border-top: 2.5px solid var(--gold); border-right: 2.5px solid var(--gold);
      filter: drop-shadow(0 0 6px var(--gold));
    }
    .sel-frame::before { left: -11px; transform: translateY(-50%) rotate(225deg); }
    .sel-frame::after  { right: -11px; transform: translateY(-50%) rotate(45deg); }

    /* Countdown badge */
    .cdown {
      position: absolute; top: 14px; right: 14px; z-index: 5;
      min-width: 72px; padding: 8px 12px;
      border: 1px solid rgba(78,232,200,0.35);
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      color: var(--teal);
      font-size: 1.6rem; font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px var(--teal);
    }

    /* ── Reel items ── */
    .reel {
      position: relative; width: 100%;
      transform-style: preserve-3d; perspective: 700px;
    }
    .ri {
      position: absolute; width: calc(100% - 32px);
      left: 16px; top: calc(50% - 38px);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: filter .12s;
    }
    .ri-name {
      font-size: clamp(1.1rem,3vw,1.9rem);
      font-weight: 800;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ri-meta { font-size: .88rem; color: var(--muted); margin-top: 3px; }
    .rolling .ri { filter: blur(2px) brightness(1.1); }

    /* Difficulty badge */
    .badge {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: .82rem; font-weight: 800;
      letter-spacing: .06em;
    }
    .easy   { background: rgba(78,232,168,0.18); color: var(--easy);   border: 1px solid rgba(78,232,168,0.4); }
    .normal { background: rgba(245,200,66,0.15); color: var(--normal); border: 1px solid rgba(245,200,66,0.4); }
    .hard   { background: rgba(255,107,107,0.15); color: var(--hard);  border: 1px solid rgba(255,107,107,0.4); }

    /* ── Status ── */
    .status {
      margin-top: 20px; min-height: 32px;
      font-size: clamp(.95rem,2.5vw,1.2rem);
      color: var(--gold); letter-spacing: .06em;
      text-shadow: 0 0 16px rgba(245,200,66,0.5);
      animation: fadePulse 2s ease-in-out infinite;
    }
    @keyframes fadePulse { 0%,100% { opacity:1; } 50% { opacity:.65; } }

    /* ── Buttons ── */
    .btns {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 14px; margin-top: 24px;
    }

    .btn {
      cursor: pointer; border: 0; outline: none;
      font: 800 1.05rem/1 inherit;
      letter-spacing: .06em;
      padding: 16px 36px;
      border-radius: 14px;
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { filter: saturate(0) brightness(.55); cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, #f5c842 0%, #e8973a 100%);
      color: #1a0f00;
      box-shadow: 0 6px 32px rgba(245,200,66,0.4), 0 2px 0 rgba(0,0,0,0.3) inset;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(245,200,66,0.55), 0 2px 0 rgba(0,0,0,0.3) inset;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.07);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    /* ── Result card ── */
    .result {
      display: none; width: 100%;
      margin-top: 28px;
      border-radius: 24px;
      border: 1px solid rgba(245,200,66,0.35);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245,200,66,0.14), transparent 55%),
        rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: clamp(24px,4vw,40px);
      box-shadow: 0 0 60px rgba(245,200,66,0.15), 0 30px 70px rgba(0,0,0,0.4);
      text-align: center;
    }
    .result.show {
      display: block;
      animation: revealCard .7s cubic-bezier(.22,.9,.36,1.1) both;
    }
    @keyframes revealCard {
      from { opacity:0; transform: translateY(20px) scale(.96); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .result-eyebrow {
      font-size: .78rem; font-weight: 700; letter-spacing: .28em;
      text-transform: uppercase; color: var(--gold);
      opacity: .85; margin-bottom: 12px;
    }

    .result-name {
      font-size: clamp(1.9rem,5vw,3.8rem);
      font-weight: 900; letter-spacing: -.03em; line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 24px rgba(245,200,66,0.35));
      margin-bottom: 14px;
    }

    .result-badge { margin-bottom: 24px; }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }

    .meta-cell {
      padding: 16px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    .meta-val {
      display: block; font-size: 1.4rem; font-weight: 900;
      color: #fff; margin-bottom: 4px;
    }
    .meta-lbl { font-size: .78rem; color: var(--muted); letter-spacing: .08em; }

    .ticket {
      display: inline-block;
      margin-top: 22px;
      padding: 9px 22px;
      border-radius: 999px;
      border: 1px dashed rgba(245,200,66,0.5);
      background: rgba(245,200,66,0.07);
      color: var(--gold); font-size: .88rem; font-weight: 700; letter-spacing: .08em;
    }

    /* ── Canvas ── */
    canvas.confetti { position:fixed; inset:0; z-index:999; pointer-events:none; }

    /* ── Responsive ── */
    @media (max-width:640px) {
      h1 { letter-spacing: -.02em; }
      .ri { flex-direction: column; align-items: flex-start; }
      .ri-name { font-size: 1.15rem; }
      .meta-row { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .btns { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 220 L180 80 L340 160 L500 30 L680 140 L860 60 L1020 150 L1200 40 L1440 120 L1440 220 Z" fill="rgba(78,232,200,0.055)"/>
      <path d="M0 220 L220 120 L400 190 L580 70 L760 170 L940 90 L1100 175 L1300 80 L1440 150 L1440 220 Z" fill="rgba(157,125,255,0.07)"/>
      <path d="M0 220 L120 160 L300 200 L500 100 L700 190 L900 120 L1100 200 L1300 130 L1440 180 L1440 220 Z" fill="rgba(245,200,66,0.055)"/>
    </svg>
  </div>

  <canvas class="confetti" id="confetti"></canvas>

  <main class="page">
    <div class="tag">广州 · 周末远征 · 32条线路</div>

    <h1>本周爬哪座山？</h1>

    <p class="sub">把 32 条广州登山线路丢进天命滚轮，滚动 5 秒，山神亲自为你锁定本周路线。</p>

    <div class="card" id="machine">
      <div class="reel-win" id="reelWrap">
        <div class="sel-frame" aria-hidden="true"></div>
        <div class="cdown" id="cdown">5.0</div>
        <div class="reel" id="reel"></div>
      </div>

      <p class="status" id="status">点击"开始抽签"，交给天命决定</p>

      <div class="btns">
        <button class="btn btn-primary" id="drawBtn" type="button">开始抽签</button>
        <button class="btn btn-ghost" id="shuffleBtn" type="button">重新洗牌</button>
      </div>

      <article class="result" id="result">
        <div class="result-eyebrow">本周命定路线</div>
        <div class="result-name" id="resultName"></div>
        <div class="result-badge">
          <span class="badge" id="resultDifficulty"></span>
        </div>
        <div class="meta-row">
          <div class="meta-cell">
            <span class="meta-val" id="resultDistance"></span>
            <span class="meta-lbl">线路距离</span>
          </div>
          <div class="meta-cell">
            <span class="meta-val" id="resultClimb"></span>
            <span class="meta-lbl">累计爬升</span>
          </div>
          <div class="meta-cell">
            <span class="meta-val" id="resultTime"></span>
            <span class="meta-lbl">参考耗时</span>
          </div>
          <div class="meta-cell">
            <span class="meta-val" id="resultSeason"></span>
            <span class="meta-lbl">适合月份</span>
          </div>
        </div>
        <div class="ticket">天命已定 · 本周出发不能反悔</div>
      </article>
    </div>
  </main>

  <script>
    const trails = [
      { name: "暹岗大山-黄陂徒步线",      distance: "10.28km", climb: "619m",  time: "03:57", season: "全年",       difficulty: "标准" },
      { name: "大夫山往返线（北门）",       distance: "3.75km",  climb: "234m",  time: "01:30", season: "全年",       difficulty: "轻松" },
      { name: "油麻山（金坑-华峰）",        distance: "8.27km",  climb: "628m",  time: "02:37", season: "全年",       difficulty: "标准" },
      { name: "帽峰山-甜橙农庄环线",        distance: "5.36km",  climb: "344m",  time: "01:24", season: "3-7月",      difficulty: "轻松" },
      { name: "番禺滴水岩森林公园亲子线",   distance: "6.50km",  climb: "366m",  time: "02:58", season: "全年",       difficulty: "标准" },

      { name: "东平六片山徒步线",           distance: "6.53km",  climb: "290m",  time: "01:47", season: "全年",       difficulty: "标准" },

      { name: "火炉山小环线（凤凰台）",     distance: "7.36km",  climb: "413m",  time: "02:34", season: "1-5,10-12月", difficulty: "轻松" },

      { name: "火炉山-凤凰山徒步线",        distance: "10.93km", climb: "633m",  time: "03:46", season: "全年",       difficulty: "轻松" },
      { name: "黄麻村湖溪小环线",           distance: "3.62km",  climb: "111m",  time: "01:27", season: "全年",       difficulty: "轻松" },

      { name: "天堂顶（大坪-影古驿站）",    distance: "16.30km", climb: "1129m", time: "04:32", season: "9-10月",     difficulty: "困难" },
      { name: "牛牯嶂小环线（大猪兜水库）", distance: "6.14km",  climb: "540m",  time: "02:00", season: "全年",       difficulty: "标准" },
      { name: "黄麻线短线",                 distance: "6.17km",  climb: "287m",  time: "02:10", season: "全年",       difficulty: "轻松" },
      { name: "牛木线穿黄麻山",             distance: "10.26km", climb: "537m",  time: "02:49", season: "全年",       difficulty: "标准" },
      { name: "六片山徒步永泰环线",         distance: "16.82km", climb: "830m",  time: "04:05", season: "1-4月",      difficulty: "困难" },
      { name: "六片山环线",                 distance: "5.01km",  climb: "237m",  time: "02:16", season: "全年",       difficulty: "轻松" },
      { name: "牛木线（牛头山-木强水库）",  distance: "16.12km", climb: "844m",  time: "05:20", season: "全年",       difficulty: "困难" }

    const reel       = document.querySelector("#reel");
    const reelWrap   = document.querySelector("#reelWrap");
    const machine    = document.querySelector("#machine");
    const drawBtn    = document.querySelector("#drawBtn");
    const shuffleBtn = document.querySelector("#shuffleBtn");
    const statusEl   = document.querySelector("#status");
    const cdownEl    = document.querySelector("#cdown");
    const result     = document.querySelector("#result");
    const resName    = document.querySelector("#resultName");
    const resDiff    = document.querySelector("#resultDifficulty");
    const resDist    = document.querySelector("#resultDistance");
    const resClimb   = document.querySelector("#resultClimb");
    const resTime    = document.querySelector("#resultTime");
    const resSeason  = document.querySelector("#resultSeason");
    const canvas     = document.querySelector("#confetti");
    const ctx        = canvas.getContext("2d");

    let pool        = [...trails];
    let rolling     = false;
    let particles   = [];
    let raf         = null;
    let audioCtx    = null;

    const diffCls = d => ({ "轻松":"easy", "标准":"normal", "困难":"hard" })[d] || "normal";

    function shuffleArr(a) {
      return a.map(x => ({ x, r: Math.random() })).sort((a,b) => a.r - b.r).map(({x}) => x);
    }

    function renderReel(center = 0) {
      const items = [];
      for (let off = -3; off <= 3; off++) {
        const i = (center + off + pool.length) % pool.length;
        items.push({ t: pool[i], off });
      }
      const SLOT_H = 88; // px per slot
      reel.innerHTML = items.map(({ t, off }) => {
        const depth   = Math.abs(off);
        const scale   = 1 - depth * 0.13;
        const opacity = 1 - depth * 0.28;
        const ty      = off * SLOT_H;
        return `
          <div class="ri" style="transform:translateY(${ty}px) scale(${scale});opacity:${opacity};">
            <div style="min-width:0;">
              <div class="ri-name">${t.name}</div>
              <div class="ri-meta">${t.distance} · 爬升 ${t.climb} · ${t.time}</div>
            </div>
            <span class="badge ${diffCls(t.difficulty)}">${t.difficulty}</span>
          </div>`;
      }).join("");
    }

    function showResult(t) {
      resName.textContent   = t.name;
      resDiff.textContent   = t.difficulty;
      resDiff.className     = `badge ${diffCls(t.difficulty)}`;
      resDist.textContent   = t.distance;
      resClimb.textContent  = t.climb;
      resTime.textContent   = t.time;
      resSeason.textContent = t.season;
      result.classList.remove("show");
      void result.offsetWidth;
      result.classList.add("show");
    }

    /* ── Audio ── */
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, type, dur, vol = 0.08) {
      const ac = getAudio();
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    }
    const blip = () => tone(300 + Math.random() * 500, "square", 0.04, 0.04);
    const win  = () => [440,554,659,880,1108].forEach((f,i) => setTimeout(() => tone(f,"sine",.25,.12), i*90));

    /* ── Spin ── */
    function spin() {
      if (rolling) return;
      rolling = true;
      drawBtn.disabled = shuffleBtn.disabled = true;
      result.classList.remove("show");
      reelWrap.classList.add("rolling");
      statusEl.textContent = "天命滚轮旋转中…";

      const target    = Math.floor(Math.random() * pool.length);
      const t0        = performance.now();
      const DURATION  = 5000;
      const startIdx  = Math.floor(Math.random() * pool.length);
      const rounds    = 7 + Math.floor(Math.random() * 3);
      const total     = rounds * pool.length + ((target - startIdx + pool.length) % pool.length);
      let lastIdx = -1;

      (function tick(now) {
        const p = Math.min((now - t0) / DURATION, 1);
        const e = 1 - Math.pow(1 - p, 4);       // easeOutQuart
        const step = Math.floor(e * total);
        const idx  = (startIdx + step) % pool.length;
        cdownEl.textContent = Math.max(0, (DURATION - (now - t0)) / 1000).toFixed(1);

        if (idx !== lastIdx) { blip(); lastIdx = idx; renderReel(idx); }

        if (p < 1) { requestAnimationFrame(tick); return; }

        renderReel(target);
        const winner = pool[target];
        rolling = false;
        drawBtn.disabled = shuffleBtn.disabled = false;
        drawBtn.textContent = "再抽一次";
        reelWrap.classList.remove("rolling");
        cdownEl.textContent = "0.0";
        statusEl.textContent = "天命已定，本周路线锁定！";
        win(); showResult(winner); burst();
      })(t0);
    }

    /* ── Confetti ── */
    function resize() {
      canvas.width  = innerWidth  * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width  = innerWidth  + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function burst() {
      const cols = ["#f5c842","#4ee8c8","#9d7dff","#ff6b6b","#fff","#e8973a"];
      particles = Array.from({ length: 220 }, () => ({
        x:  innerWidth  * .5,
        y:  innerHeight * .45,
        vx: (Math.random() - .5) * 26,
        vy: Math.random() * -18 - 4,
        sz: Math.random() * 9 + 3,
        c:  cols[Math.random() * cols.length | 0],
        life: 70 + Math.random() * 60,
        rot: Math.random() * Math.PI,
        dr: (Math.random() - .5) * .4
      }));
      if (!raf) animate();
    }

    function animate() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .985;
        p.life -= 1; p.rot += p.dr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(p.life / 90, 0);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz * .55);
        ctx.restore();
      });
      if (particles.length) { raf = requestAnimationFrame(animate); }
      else { raf = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }

    drawBtn.addEventListener("click", () => { getAudio(); spin(); });
    shuffleBtn.addEventListener("click", () => {
      if (rolling) return;
      getAudio();
      tone(260, "sawtooth", .1, .07);
      pool = shuffleArr(pool);
      renderReel(0);
      cdownEl.textContent = "5.0";
      statusEl.textContent = "牌堆已洗，点击开始抽签";
    });
    addEventListener("resize", resize);

    resize();
    renderReel(0);
  </script>
</body>
</html>
